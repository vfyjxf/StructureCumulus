import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.122'
    id 'dev.vfyjxf.cloudlib.lang'
    id 'dev.vfyjxf.cloudlib.style'
    id 'dev.vfyjxf.cloudlib.pmd'
    id "net.ltgt.errorprone" version "4.4.0"
}

cloudLang {
    modId = 'structurecumulus'
    packageName = 'dev.vfyjxf.cumulus.data.lang'
    className = 'CumulusLang'
    constantNameStyle = 'camel'
    entryClass = 'dev.vfyjxf.cumulus.data.lang.LangEntry'
}

spotless {
    java {
        targetExclude 'build/generated/sources/langKeys/**'
    }
}

// the cloudstyle plugin unpacks its JDT formatter profile into build/cloudstyle at configuration
// time — a plain file write during configuration, not a task output — so a clean that wiped
// build/ wholesale would leave spotless reading a profile the clean step had just deleted. The
// profile survives; everything else under build/ is discarded as before
tasks.named('clean', Delete) {
    setDelete(fileTree('build') { exclude 'cloudstyle/**' })
}

version = project.mod_version
group = project.maven_group
project.ext.cloudlib_version = '0.1.11'
project.ext.jei_version = '19.27.0.340'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The kernel is a separate source set with no Minecraft on its compile classpath. That is the
// primary purity gate; kernelPurity below is the textual backstop for names the compiler cannot see.
sourceSets {
    kernel {
        java.srcDir 'src/kernel/java'
    }
    kernelTest {
        java.srcDir 'src/kernelTest/java'
        compileClasspath += sourceSets.kernel.output
        runtimeClasspath += sourceSets.kernel.output
    }
    // The dev-only client-test composition: scenarios compile against the engine and CloudLib's
    // harness API, and are loaded only by the harness runs as the structurecumulusuitest mod.
    uitest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    // The scenario mod's identity; toml only, folded into the structurecumulusuitest mod.
    uitestMod {}
}

configurations {
    uitestImplementation.extendsFrom implementation
    uitestCompileOnly.extendsFrom compileOnly
    uitestRuntimeOnly.extendsFrom runtimeOnly
}

// The kernel is part of the mod's runtime output; without this the NeoForge run classpath
// sees main classes but not the kernel interfaces they implement.
sourceSets.main.output.dir(sourceSets.kernel.output, builtBy: tasks.named('kernelClasses'))

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        structurecumulus {
            sourceSet(sourceSets.main)
        }
        structurecumulusuitest {
            sourceSet(sourceSets.uitest)
            sourceSet(sourceSets.uitestMod)
        }
    }

    unitTest {
        enable()
        testedMod = mods.structurecumulus
        loadedMods.add(mods.structurecumulus)
    }

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
            loadedMods.add(neoForge.mods.structurecumulus)
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
            loadedMods.add(neoForge.mods.structurecumulus)
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            server()
            gameDirectory = project.file('runs/gameTest')
            programArgument '--nogui'
            loadedMods.add(neoForge.mods.structurecumulus)
            systemProperty 'neoforge.gameTestServer', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty('terminal.jline', 'true')
        }
    }
}

// Visual client-test runs are headless by default; only -PclTestWindowed opts back into a visible
// window for the manual gallery. gradle/cloudlib-uitest.gradle consumes this default.
project.ext.cloudlibUiTestHeadlessByDefault = true
apply from: rootProject.file('gradle/cloudlib-uitest.gradle')

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.blamejared.com/" }
}

dependencies {
    // CloudLib is the in-world UI engine; localRuntime hands the jar to FML mod discovery in dev.
    implementation "dev.vfyjxf.cloudlib:cloudlib:${project.cloudlib_version}"
    localRuntime "dev.vfyjxf.cloudlib:cloudlib:${project.cloudlib_version}"
    // The harness API is compile-only for scenarios: the harness is a separately staged mod, never
    // a production or normal-run runtime dependency.
    uitestCompileOnly "dev.vfyjxf.cloudlib:cloudlib-uitest:${project.cloudlib_version}"
    // CloudLib declares JEI as a required mod dependency.
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${project.jei_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${project.jei_version}"

    // the kernel compiles on its own classpath and is consumed by the mod source set
    implementation sourceSets.kernel.output
    kernelCompileOnly 'org.jspecify:jspecify:1.0.1'
    kernelTestImplementation sourceSets.kernel.output
    kernelTestImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    kernelTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    kernelTestCompileOnly 'org.jspecify:jspecify:1.0.1'

    // JSpecify is what the sources annotate with. The test set declares its own copy rather than
    // inheriting compileOnly, so the annotation is present on the classpath that reads it.
    compileOnly 'org.jspecify:jspecify:1.0.1'
    testCompileOnly 'org.jspecify:jspecify:1.0.1'

    // NullAway 0.12.15 is built and tested against Error Prone 2.42.0
    errorprone 'com.uber.nullaway:nullaway:0.12.15'
    errorprone 'com.google.errorprone:error_prone_core:2.42.0'

    // the jar of the mixin build NeoForge runs doubles as the annotation processor
    annotationProcessor 'net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7'
}

// mojmap has no obfuscation data, so a missing obf lookup is noise while an unresolvable
// injection target is an error
tasks.named('compileJava') {
    options.compilerArgs += [
        '-AMSG_NO_OBFDATA_FOR_TARGET=note',
        '-AMSG_MISSING_INJECTOR_DESC_SINGLETARGET=error',
        '-AMSG_MISSING_INJECTOR_DESC_MULTITARGET=error'
    ]
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        events 'failed'
        showStackTraces = true
    }
}

tasks.register('kernelTest', Test) {
    description = 'Runs the kernel tests, which carry no Minecraft.'
    testClassesDirs = sourceSets.kernelTest.output.classesDirs
    classpath = sourceSets.kernelTest.runtimeClasspath
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        events 'failed'
        showStackTraces = true
    }
}

tasks.register('kernelPurity') {
    description = 'Fails if a kernel source names Minecraft, NeoForge or Mojang.'
    def sources = fileTree('src/kernel/java') { include '**/*.java' }
    inputs.files(sources)
    doLast {
        def banned = ['net.minecraft', 'net.neoforged', 'com.mojang']
        def offenders = []
        sources.each { file ->
            file.eachLine { line, number ->
                if (banned.any { line.contains(it) }) {
                    offenders << "${file}:${number}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('kernel purity violated:\n' + offenders.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn 'kernelTest', 'kernelPurity', 'compileUitestJava', 'verifyRunIsolation', 'verifyHarnessIsolation'
}

// The harness runs are the only compositions that load structurecumulusuitest, and the harness is a
// mods-folder jar rather than a classpath entry. These gates pin both halves: what each run declares,
// and which game directory each staging task owns. They cannot inspect the task graph under the
// configuration cache, so the harness scripts record the directory -> staging task map.
def harnessRuns = ['clientTests': 'stageClientTestsUiTestMod',
                   'galleryClient': 'stageGalleryClientUiTestMod']
def harnessRunMods = harnessRuns.keySet().collectEntries { name ->
    [(name): neoForge.runs.named(name).map { run -> run.loadedMods.get()*.name.sort().join(',') }]
}
def harnessStagingDirs = project.ext.cloudlibUiTestStagedDirs
if (harnessStagingDirs == null) {
    throw new GradleException(
        'gradle/cloudlib-uitest.gradle must run before the isolation gates: it records which run '
            + 'directories stage the cloudlibuitest harness mod'
    )
}
if (!harnessStagingDirs.keySet().containsAll(['runs/client-tests', 'runs/gallery-client'])) {
    throw new GradleException(
        'every harness run must have a staging directory, found: ' + harnessStagingDirs.keySet()
    )
}
harnessStagingDirs.each { runDirName, stageTaskName ->
    if (tasks.findByName(stageTaskName) == null) {
        throw new GradleException(runDirName + ' names the staging task ' + stageTaskName + ', which does not exist')
    }
}
def plainRunNames = ['client', 'server', 'gameTestServer']
def plainRunDirs = plainRunNames.collectEntries { name ->
    [(name): neoForge.runs.named(name).map { run -> run.gameDirectory.get().asFile.absolutePath }]
}
def plainRunMods = plainRunNames.collectEntries { name ->
    [(name): neoForge.runs.named(name).map { run -> run.loadedMods.get()*.name.sort().join(',') }]
}
def galleryRunDir = neoForge.runs.named('galleryClient')
    .map { run -> run.gameDirectory.get().asFile.absolutePath }
def harnessStagingAbsoluteDirs = harnessStagingDirs.keySet().collect { new File(projectDir, it).absolutePath }

tasks.register('verifyRunIsolation') {
    group = 'verification'
    description = 'Verifies that only the harness runs load the UI-test composition and stage its harness jar.'
    inputs.property('harnessStagingDirs', harnessStagingDirs.collect { dir, task -> dir + '=' + task }.sort().join(','))
    inputs.property('harnessStagingAbsoluteDirs', harnessStagingAbsoluteDirs.sort().join(','))
    harnessRunMods.each { name, provider -> inputs.property('harnessRunMods.' + name, provider) }
    plainRunMods.each { name, provider -> inputs.property('plainRunMods.' + name, provider) }
    plainRunDirs.each { name, provider -> inputs.property('plainRunDir.' + name, provider) }
    inputs.property('galleryRunDir', galleryRunDir)
    doLast {
        harnessRuns.each { runName, stageTaskName ->
            def declared = harnessRunMods[runName].get()
            if (declared != 'structurecumulus,structurecumulusuitest') {
                throw new GradleException(
                    'the ' + runName + ' harness run must load the engine and UI-test composition '
                        + '(structurecumulus + structurecumulusuitest), found: ' + declared
                )
            }
            if (harnessStagingDirs.find { it.value == stageTaskName } == null) {
                throw new GradleException(
                    'the ' + runName + ' harness run stages through ' + stageTaskName + ', which is not recorded'
                )
            }
        }
        if (!harnessStagingAbsoluteDirs.contains(galleryRunDir.get())) {
            throw new GradleException(
                'runGalleryClient must stage the cloudlibuitest harness mod, found game directory: ' + galleryRunDir.get()
            )
        }
        plainRunNames.each { name ->
            def mods = plainRunMods[name].get()
            if (mods != 'structurecumulus') {
                throw new GradleException(
                    'the ' + name + ' run must load only the production mod, found: ' + mods
                )
            }
            if (harnessStagingAbsoluteDirs.contains(plainRunDirs[name].get())) {
                throw new GradleException(
                    'the ' + name + " run's game directory must not stage the cloudlibuitest harness mod, "
                        + 'found: ' + plainRunDirs[name].get()
                )
            }
        }
        logger.lifecycle(
            'run isolation verified: harnessRuns=[{}] plainRunDirs=[{}] galleryRun=[{}]',
            harnessRuns.keySet().collect { it + '=' + harnessRunMods[it].get() }.join(' '),
            plainRunDirs.collect { it.key + '=' + it.value.get() }.join(' '),
            galleryRunDir.get()
        )
    }
}

// The published jar and every normal run stay harness-free: no scenario classes and no
// cloudlib-uitest artifact may reach either the jar or the production runtime classpath.
def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def productionRuntime = configurations.runtimeClasspath
tasks.register('verifyHarnessIsolation') {
    group = 'verification'
    description = 'Verifies the production jar and runtime classpath carry no UI-test harness code.'
    inputs.files(productionJar)
    inputs.files(productionRuntime)
    doLast {
        def offenders = []
        def jarFile = productionJar.get().asFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.startsWith('dev/vfyjxf/cumulus/uitest/')
                        || entry.name.startsWith('META-INF/structurecumulusuitest')) {
                    offenders.add(entry.name)
                }
            }
        }
        productionRuntime.files.each { file ->
            if (file.name ==~ /cloudlib-uitest-.*\.jar/ || file.name ==~ /structurecumulusuitest.*\.jar/) {
                offenders.add(file.absolutePath)
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('the production jar/runtime carries harness code: ' + offenders)
        }
        logger.lifecycle('harness isolation verified: no scenario classes or cloudlib-uitest jar on the production side')
    }
}

tasks.named('jar', Jar) {
    // kernel classes are already in the main output
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

// NullAway runs as an Error Prone plugin over every source set (main and test). OnlyNullMarked
// restricts the analysis to code carrying @NullMarked, which keeps Minecraft, NeoForge and
// third-party boundaries out of it — those carry no JSpecify annotations to reason about.
// disableAllChecks keeps Error Prone's stock checks off: this wiring is a null-safety pass.
tasks.withType(JavaCompile).configureEach {
    // javac caps diagnostics at 100 by default; a NullAway sweep needs the whole list
    options.compilerArgs.addAll(['-Xmaxwarns', '2000', '-Xmaxerrs', '2000'])
    options.errorprone {
        disableAllChecks = true
        option("NullAway:OnlyNullMarked", "true")
        option("NullAway:CastToNonNullMethod", "dev.vfyjxf.cumulus.kernel.core.Checks.checkNotNull")
        check("NullAway", CheckSeverity.ERROR)
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
