modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT License"

[[mixins]]
config = "structurecumulus.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
    StructureCumulus — project skeleton: entry point, distributed lang sources and the shared
    style, lint and null-safety gates. No game content yet.
'''
authors = "vfyjxf_"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
