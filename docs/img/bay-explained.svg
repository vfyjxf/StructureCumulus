<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="PingFang SC, Helvetica, Arial, sans-serif">
  <rect width="1120" height="640" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1f2328">为什么是 Bay，而不是一个巨大的 Check？</text>
  <text x="40" y="66" font-size="13" fill="#57606a">一个多方块结构的不同部分，判的东西、判的阶段、拥有的格子都不一样；Bay 就是“可独立断言、可独立声明归属的一段长方体”。</text>

  <!-- front view -->
  <g>
    <text x="40" y="100" font-size="14" font-weight="600" fill="#1f2328">7×6×7 熔炉（正视图）</text>
    <rect x="40" y="112" width="392" height="276" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <g stroke="#d0d7de" stroke-width="1">
      <path d="M96 112 V388 M152 112 V388 M208 112 V388 M264 112 V388 M320 112 V388 M376 112 V388"/>
      <path d="M40 158 H432 M40 204 H432 M40 250 H432 M40 296 H432 M40 342 H432"/>
    </g>
    <rect x="96" y="158" width="280" height="184" fill="none" stroke="#0969da" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="208" y="250" width="112" height="138" fill="#fff3e0" stroke="#c2410c" stroke-width="2"/>
    <text x="264" y="322" font-size="13" text-anchor="middle" fill="#7c2d12">门 2×3</text>
    <text x="236" y="150" font-size="12" fill="#0969da">内腔 5×4×5：判体积，不是逐格方块</text>
    <text x="52" y="136" font-size="12" fill="#57606a">外壳：逐格判方块</text>
  </g>

  <!-- why box -->
  <g>
    <rect x="470" y="100" width="610" height="300" rx="10" fill="#fff8c5" stroke="#bf8700"/>
    <text x="490" y="128" font-size="15" font-weight="700" fill="#7d4e00">四个“不一样”，逼出了 Bay</text>
    <text x="490" y="158" font-size="13" fill="#5c3d00">1. 主体类型不一样：方块是 OccupantSnapshot，门是 DoorView，体积是 Long。</text>
    <text x="504" y="178" font-size="12" fill="#7d4e00">一个 Check&lt;T&gt; 只有一个 T，一个谓词只能判一种主体。</text>
    <text x="490" y="208" font-size="13" fill="#5c3d00">2. 判定阶段不一样：门在 FORM 判，体积要等计算和折叠，常常到 SETTLE。</text>
    <text x="490" y="238" font-size="13" fill="#5c3d00">3. 拥有的格子不一样：外壳逐格拥有；空腔整块拥有；读到的格子 ≠ 拥有的格子。</text>
    <text x="490" y="268" font-size="13" fill="#5c3d00">4. 分块与缓存需要边界：Bay 的格子是一个长方体，才能切区段、算闭包、做缓存。</text>
    <text x="490" y="304" font-size="13" font-weight="600" fill="#7d4e00">所以：Bay 不是“一个方块”，也不是“整个结构”，</text>
    <text x="490" y="324" font-size="13" font-weight="600" fill="#7d4e00">而是一段可以被单独判、单独拥有、单独排阶段的长方体。</text>
    <text x="490" y="352" font-size="12" fill="#7d4e00">Check = 取一个主体（Focus）+ 判它（Expectation）。</text>
    <text x="490" y="372" font-size="12" fill="#7d4e00">Requirement = 这个 Bay 的所有 Check 与 Computation。</text>
    <text x="490" y="392" font-size="12" fill="#7d4e00">Coverage = 必须建立什么；Footprint = 拥有哪些格；两者不是一回事。</text>
  </g>

  <!-- bay cards -->
  <g>
    <rect x="40" y="430" width="330" height="170" rx="10" fill="#ffffff" stroke="#8c959f"/>
    <text x="58" y="456" font-size="15" font-weight="700" fill="#1f2328">bay “wall”</text>
    <text x="58" y="480" font-size="12" fill="#57606a">格子：外壳 194 格 · 一个长方体</text>
    <text x="58" y="500" font-size="12" fill="#57606a">Coverage：EVERY_CELL（每格都要被判）</text>
    <text x="58" y="520" font-size="12" fill="#57606a">主体：OccupantSnapshot · Stage FORM</text>
    <text x="58" y="540" font-size="12" fill="#57606a">声明：EXCLUSIVE / Owned</text>
    <text x="58" y="566" font-size="12" fill="#0a3069">为什么：每格独立判砖，逐格拥有。</text>

    <rect x="395" y="430" width="330" height="170" rx="10" fill="#ffffff" stroke="#8c959f"/>
    <text x="413" y="456" font-size="15" font-weight="700" fill="#1f2328">bay “mouth”</text>
    <text x="413" y="480" font-size="12" fill="#57606a">格子：门洞 2 格（1×2×1）</text>
    <text x="413" y="500" font-size="12" fill="#57606a">Coverage：ONE_SUBJECT（格子 = 主体足迹）</text>
    <text x="413" y="520" font-size="12" fill="#57606a">主体：DoorView（两扇半边）· Stage FORM</text>
    <text x="413" y="540" font-size="12" fill="#57606a">声明：EXCLUSIVE / Occupied</text>
    <text x="413" y="560" font-size="11" fill="#0a3069">为什么：门是两格一个整体，</text>
    <text x="413" y="578" font-size="11" fill="#0a3069">拆开判会把半扇门当成门。</text>

    <rect x="750" y="430" width="330" height="170" rx="10" fill="#ffffff" stroke="#8c959f"/>
    <text x="768" y="456" font-size="15" font-weight="700" fill="#1f2328">bay “interior”</text>
    <text x="768" y="480" font-size="12" fill="#57606a">格子：5×4×5 = 100 格</text>
    <text x="768" y="500" font-size="12" fill="#57606a">Coverage：ANY_SUBJECT（不断言逐格）</text>
    <text x="768" y="520" font-size="12" fill="#57606a">主体：Long（体积）· Stage SETTLE</text>
    <text x="768" y="540" font-size="12" fill="#57606a">声明：EXCLUSIVE / Owned</text>
    <text x="768" y="560" font-size="11" fill="#0a3069">为什么：判据是算出来的值，不是逐格方块；</text>
    <text x="768" y="578" font-size="11" fill="#0a3069">空腔必须被保护。</text>
  </g>
</svg>
