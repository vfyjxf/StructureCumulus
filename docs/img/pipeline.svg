<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="PingFang SC, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1f2328">一次 check 的流水线：每一步都在回答“为什么不能省”</text>
  <text x="40" y="66" font-size="13" fill="#57606a">从上到下是数据形态；箭头旁是这一步存在的理由。黄色步骤可能以 Undecided/Deferred 结束，绿色步骤产出最终结果。</text>

  <!-- row 1 -->
  <g>
    <rect x="40" y="100" width="250" height="180" rx="10" fill="#ffffff" stroke="#8c959f"/>
    <text x="56" y="126" font-size="15" font-weight="700" fill="#1f2328">1. 捕获</text>
    <text x="56" y="150" font-size="12" fill="#57606a">输入：世界 + 读闭包</text>
    <text x="56" y="170" font-size="12" fill="#57606a">输出：不可变快照 + 租约</text>
    <text x="56" y="200" font-size="12" fill="#0a3069">为什么：检查跑在 worker 上，</text>
    <text x="56" y="218" font-size="12" fill="#0a3069">不能读活世界；租约负责释放。</text>
    <text x="56" y="246" font-size="11" fill="#8c959f">SectionSlot：Air / Present / Refused</text>

    <rect x="330" y="100" width="250" height="180" rx="10" fill="#ffffff" stroke="#8c959f"/>
    <text x="346" y="126" font-size="15" font-weight="700" fill="#1f2328">2. 展开</text>
    <text x="346" y="150" font-size="12" fill="#57606a">输入：Blueprint + Stage</text>
    <text x="346" y="170" font-size="12" fill="#57606a">输出：有序 CheckPlan</text>
    <text x="346" y="200" font-size="12" fill="#0a3069">为什么：顺序固定，结果才可复现，</text>
    <text x="346" y="218" font-size="12" fill="#0a3069">缓存才能按 unit 命中。</text>
    <text x="346" y="246" font-size="11" fill="#8c959f">section → 屏障 → aggregate → checks</text>

    <rect x="620" y="100" width="250" height="180" rx="10" fill="#ffffff" stroke="#8c959f"/>
    <text x="636" y="126" font-size="15" font-weight="700" fill="#1f2328">3. 区段计算</text>
    <text x="636" y="150" font-size="12" fill="#57606a">输入：一个 section</text>
    <text x="636" y="170" font-size="12" fill="#57606a">输出：一个部分值</text>
    <text x="636" y="200" font-size="12" fill="#0a3069">为什么：大结构必须分块；</text>
    <text x="636" y="218" font-size="12" fill="#0a3069">部分值可以并行、可以缓存。</text>
    <text x="636" y="246" font-size="11" fill="#8c959f">此步看不到其他 section</text>

    <rect x="910" y="100" width="250" height="180" rx="10" fill="#ffffff" stroke="#8c959f"/>
    <text x="926" y="126" font-size="15" font-weight="700" fill="#1f2328">4. 屏障折叠</text>
    <text x="926" y="150" font-size="12" fill="#57606a">输入：按区段排序的部分值</text>
    <text x="926" y="170" font-size="12" fill="#57606a">输出：一个完整值</text>
    <text x="926" y="200" font-size="12" fill="#0a3069">为什么：跨区段判据必须先合成；</text>
    <text x="926" y="218" font-size="12" fill="#0a3069">任一部分缺失 → 整键缺席。</text>
    <text x="926" y="246" font-size="11" fill="#8c959f">Merge.combine，无单位元</text>
  </g>

  <!-- arrows row1 -->
  <path d="M290 190 L326 190" stroke="#57606a" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M580 190 L616 190" stroke="#57606a" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M870 190 L906 190" stroke="#57606a" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M1035 280 L1035 376" stroke="#57606a" stroke-width="1.6" marker-end="url(#p)"/>

  <!-- row 2 -->
  <g>
    <rect x="910" y="380" width="250" height="180" rx="10" fill="#ffffff" stroke="#8c959f"/>
    <text x="926" y="406" font-size="15" font-weight="700" fill="#1f2328">5. 聚合</text>
    <text x="926" y="430" font-size="12" fill="#57606a">输入：折叠值 + 已发布上下文</text>
    <text x="926" y="450" font-size="12" fill="#57606a">输出：StateKey 的值</text>
    <text x="926" y="480" font-size="12" fill="#0a3069">为什么：复杂值只算一次，</text>
    <text x="926" y="498" font-size="12" fill="#0a3069">多个谓词共享，避免重复扫世界。</text>
    <text x="926" y="526" font-size="11" fill="#8c959f">Kahn 序；只读，不再贡献</text>

    <rect x="620" y="380" width="250" height="180" rx="10" fill="#ffffff" stroke="#8c959f"/>
    <text x="636" y="406" font-size="15" font-weight="700" fill="#1f2328">6. 判定</text>
    <text x="636" y="430" font-size="12" fill="#57606a">输入：Focus 取主体 → Expectation</text>
    <text x="636" y="450" font-size="12" fill="#57606a">输出：Reply（四态）</text>
    <text x="636" y="480" font-size="12" fill="#0a3069">为什么：谓词只判一个类型化主体；</text>
    <text x="636" y="498" font-size="12" fill="#0a3069">取不到主体就不调用谓词。</text>
    <text x="636" y="526" font-size="11" fill="#8c959f">MATCH / MISMATCH / UNREADABLE / ABSTAIN</text>

    <rect x="330" y="380" width="250" height="180" rx="10" fill="#ffffff" stroke="#8c959f"/>
    <text x="346" y="406" font-size="15" font-weight="700" fill="#1f2328">7. 发布</text>
    <text x="346" y="430" font-size="12" fill="#57606a">输入：本阶段 draft</text>
    <text x="346" y="450" font-size="12" fill="#57606a">输出：带修订号的 ContextFrame</text>
    <text x="346" y="480" font-size="12" fill="#0a3069">为什么：上下文有版本；旧计算</text>
    <text x="346" y="498" font-size="12" fill="#0a3069">不能覆盖新结果（SC-CTX-0108）。</text>
    <text x="346" y="526" font-size="11" fill="#8c959f">每实例一个 store；每阶段一次 publish</text>

    <rect x="40" y="380" width="250" height="180" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="56" y="406" font-size="15" font-weight="700" fill="#0a3622">8. 结算</text>
    <text x="56" y="430" font-size="12" fill="#0a3622">输入：Bay 的格子 + 绑定足迹</text>
    <text x="56" y="450" font-size="12" fill="#0a3622">输出：Settled / Conflict</text>
    <text x="56" y="480" font-size="12" fill="#0a3622">为什么：两个结构不能同时拥有</text>
    <text x="56" y="498" font-size="12" fill="#0a3622">同一格；一次 CAS 整体替换。</text>
    <text x="56" y="526" font-size="11" fill="#0a3622">只有 Settled 才产生 Formed</text>
  </g>

  <!-- arrows row2 (right to left) -->
  <path d="M906 470 L874 470" stroke="#57606a" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M616 470 L584 470" stroke="#57606a" stroke-width="1.6" marker-end="url(#p)"/>
  <path d="M326 470 L294 470" stroke="#57606a" stroke-width="1.6" marker-end="url(#p)"/>

  <!-- result callouts -->
  <g>
    <rect x="620" y="586" width="250" height="44" rx="8" fill="#ddf4ff" stroke="#0969da"/>
    <text x="636" y="606" font-size="12" font-weight="600" fill="#0a3069">PROBE / FORM 成功 → Admitted</text>
    <text x="636" y="622" font-size="11" fill="#0a3069">没有声明、没有实例 id，不能 derive</text>

    <rect x="40" y="586" width="250" height="44" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="56" y="606" font-size="12" font-weight="600" fill="#0a3622">SETTLE 成功 → Formed</text>
    <text x="56" y="622" font-size="11" fill="#0a3622">带 claims / generation / 修订号</text>

    <rect x="330" y="586" width="250" height="44" rx="8" fill="#fff8c5" stroke="#bf8700"/>
    <text x="346" y="606" font-size="12" font-weight="600" fill="#7d4e00">任何一步读不到/被拒</text>
    <text x="346" y="622" font-size="11" fill="#7d4e00">Undecided（可重试）或 Deferred</text>

    <rect x="910" y="586" width="250" height="44" rx="8" fill="#ffebe9" stroke="#cf222e"/>
    <text x="926" y="606" font-size="12" font-weight="600" fill="#82071e">判定为 MISMATCH</text>
    <text x="926" y="622" font-size="11" fill="#82071e">Failed，可进入修复</text>
  </g>

  <text x="40" y="670" font-size="12" fill="#57606a">关键区别：Admitted 只是“这一阶段通过”；Formed 才是“结构成立且土地归属已写入”。</text>
</svg>
